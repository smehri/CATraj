[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catraj"
version = "0.1.0"
description = "Context-aware trajectory annotation, compression and prediction, compatible with MovingPandas"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Saeed Mehri", email = "sa.mehri20@gmail.com" }]
maintainers = [{ name = "Saeed Mehri", email = "sa.mehri20@gmail.com" }]
keywords = [
    "trajectory",
    "movement data",
    "context-aware",
    "trajectory annotation",
    "spatial interpolation",
    "geospatial",
    "movingpandas",
    "AIS",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# The core algorithms need only the numeric and geospatial stack. Kriging uses
# scikit-learn; everything else is numpy and scipy.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "geopandas>=0.13",
    "shapely>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# The interactive app. Deliberately not a hard dependency: the library is
# usable from a script without any of it.
# geoviews is needed because hvplot hands any GeoDataFrame to it, and the maps
# in the app and the tutorial are drawn from GeoDataFrames.
app = ["panel>=1.3", "hvplot>=0.9", "holoviews>=1.18", "bokeh>=3.3", "geoviews>=1.11"]
# Writing context onto movingpandas.Trajectory objects.
movingpandas = ["movingpandas>=0.17"]
test = ["pytest>=7"]
dev = ["catraj[app,movingpandas,test]", "black", "ruff"]

[project.urls]
Repository = "https://github.com/smehri/catraj"
Issues = "https://github.com/smehri/catraj/issues"

[tool.setuptools.packages.find]
where = ["02_src"]

[tool.setuptools.package-data]
catraj = ["py.typed"]
# Figures ship with the package; the author's working notes do not.
"catraj.annotation" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["03_tests"]
markers = [
    "data: needs the sample datasets in 08_datasets/",
    "movingpandas: needs the optional movingpandas dependency",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]
